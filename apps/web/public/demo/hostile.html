<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget isolation test (hostile CSS)</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      Test page: deliberately aggressive styles of the kind real store themes sometimes ship.
      The chat widget must look and work exactly as on the normal demo page.
    -->
    <style>
      * {
        all: unset !important;
        font-family: "Comic Sans MS", cursive !important;
      }
      html,
      body {
        display: block !important;
      }
      body {
        background: repeating-linear-gradient(
          45deg,
          #ff0,
          #ff0 20px,
          #f0f 20px,
          #f0f 40px
        ) !important;
        font-size: 40px !important;
        color: #0f0 !important;
      }
      div,
      button,
      iframe,
      svg {
        display: none !important;
        transform: rotate(180deg) !important;
      }
      p {
        display: block !important;
        padding: 30px !important;
      }
      .cover {
        display: block !important;
        position: fixed !important;
        inset: auto 0 0 auto !important;
        width: 220px !important;
        height: 220px !important;
        background: rgba(255, 0, 0, 0.35) !important;
        z-index: 2147482000 !important;
      }
    </style>
  </head>
  <body>
    <p>
      Hostile CSS test: every element is reset, hidden or rotated, and a red box sits in the corner.
    </p>
    <span class="cover"></span>
    <script src="/widget.js" async></script>
  </body>
</html>
